# ==============================================================================
# BÀI TẬP THỰC HÀNH: DOCKER NETWORKING & VOLUMES MASTERY
# ==============================================================================
# Tệp: 03. Docker Networking & Volumes.yml
# Khóa học: DevOps & Architecture - Docker Mastery
#
# MỤC TIÊU BÀI THỰC HÀNH:
# 1. Thiết lập Custom Bridge Network ("backend-network") để kích hoạt Docker Internal DNS.
#    - Giúp các container phân giải địa chỉ của nhau bằng tên dịch vụ (Service Name Discovery)
#    - Tách biệt môi trường mạng nội bộ an toàn, không phụ thuộc vào IP động.
# 2. Cấu hình Named Volumes ("postgres_data", "redis_data") để lưu trữ dữ liệu bền vững (Persistence)
#    - Đảm bảo dữ liệu cơ sở dữ liệu và cache không bị mất khi container bị xóa (docker compose down).
# 3. Thiết lập Healthcheck chính xác cho Postgres và Redis.
# 4. Sử dụng "depends_on" kết hợp "condition: service_healthy" để ứng dụng NestJS
#    chỉ khởi động sau khi CSDL và Redis đã thực sự sẵn sàng nhận kết nối.
#
# HƯỚNG DẪN:
# - Hãy đọc kỹ mô tả và hoàn thành các phần đánh dấu [TODO 1] đến [TODO 5] bên dưới.
# - Sau khi hoàn thành, kiểm tra cú pháp bằng: `docker compose -f "03. Docker Networking & Volumes.yml" config`
# ==============================================================================

version: '3.8'

# ------------------------------------------------------------------------------
# 1. ĐỊNH NGHĨA CÁC DỊCH VỤ (SERVICES)
# ------------------------------------------------------------------------------
services:

  # ----------------------------------------------------------------------------
  # DỊCH VỤ 1: CƠ SỞ DỮ LIỆU POSTGRESQL (Stateful Database Service)
  # ----------------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: devops_postgres_container
    restart: unless-stopped

    # [TODO 1]: Cấu hình biến môi trường (Environment Variables) cho PostgreSQL
    # Gợi ý:
    # - POSTGRES_USER: Tên người dùng quản trị (ví dụ: nest_user)
    # - POSTGRES_PASSWORD: Mật khẩu quản trị (ví dụ: nest_secure_password_2026)
    # - POSTGRES_DB: Tên cơ sở dữ liệu mặc định cần tạo (ví dụ: ecommerce_db)
    # - PGDATA: Đường dẫn lưu dữ liệu con bên trong mount point (ví dụ: /var/lib/postgresql/data/pgdata)
    environment:
      POSTGRES_USER: ${DB_USER:-nest_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nest_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      PGDATA: /var/lib/postgresql/data/pgdata

    # [TODO 2]: Cấu hình Volume Mount để duy trì dữ liệu bền vững
    # Gợi ý: Ánh xạ named volume "postgres_data" vào thư mục "/var/lib/postgresql/data" của container
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Map cổng ra máy Host để lập trình viên có thể kết nối từ DBeaver / TablePlus (Tùy chọn)
    ports:
      - "5432:5432"

    # [TODO 3]: Thiết lập Healthcheck kiểm tra trạng thái sẵn sàng của PostgreSQL
    # Gợi ý: Sử dụng công cụ `pg_isready -U <user> -d <db>`
    # - interval: Tần suất kiểm tra (ví dụ: 10s)
    # - timeout: Thời gian chờ tối đa cho mỗi lần kiểm tra (ví dụ: 5s)
    # - retries: Số lần thử lại trước khi đánh dấu unhealthy (ví dụ: 5)
    # - start_period: Thời gian ân hạn khi container mới khởi động (ví dụ: 15s)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nest_user} -d ${DB_NAME:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    # Gắn container vào Custom Bridge Network
    networks:
      - backend-network

  # ----------------------------------------------------------------------------
  # DỊCH VỤ 2: BỘ NHỚ ĐỆM & MESSAGE BROKER REDIS (In-Memory Cache Service)
  # ----------------------------------------------------------------------------
  redis-cache:
    image: redis:7.2-alpine
    container_name: devops_redis_container
    restart: unless-stopped

    # [TODO 4]: Cấu hình lệnh khởi chạy Redis kích hoạt chế độ bền vững AOF (Append Only File)
    # Gợi ý: Chạy lệnh `redis-server --appendonly yes --requirepass <password>`
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secret_pass}"]

    # Cấu hình Volume để lưu tệp dump snapshot và AOF log của Redis
    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    # Healthcheck kiểm tra Redis sẵn sàng tiếp nhận ping
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - backend-network

  # ----------------------------------------------------------------------------
  # DỊCH VỤ 3: ỨNG DỤNG BACKEND NESTJS (Stateless Application Service)
  # ----------------------------------------------------------------------------
  nestjs-app:
    # Build từ Dockerfile nằm trong thư mục gốc
    build:
      context: .
      dockerfile: Dockerfile
      target: runner # Sử dụng stage runner của multi-stage build
    container_name: devops_nestjs_container
    restart: unless-stopped

    # Map cổng 3000 từ container ra port 3000 trên máy host
    ports:
      - "3000:3000"

    # [TODO 5]: Cấu hình biến môi trường kết nối tới Postgres và Redis qua DOCKER DNS HOSTNAME
    # QUY TẮC CỐT LÕI: Không dùng 'localhost' hay '127.0.0.1'!
    # Phải sử dụng tên Service: 'postgres-db' và 'redis-cache'
    environment:
      NODE_ENV: production
      PORT: 3000
      # Thông số kết nối PostgreSQL
      DB_HOST: postgres-db # Phân giải tự động qua Docker Internal DNS
      DB_PORT: 5432
      DB_USERNAME: ${DB_USER:-nest_user}
      DB_PASSWORD: ${DB_PASSWORD:-nest_secure_password_2026}
      DB_DATABASE: ${DB_NAME:-ecommerce_db}
      # Thông số kết nối Redis
      REDIS_HOST: redis-cache # Phân giải tự động qua Docker Internal DNS
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_pass}

    # [TODO 6]: Ràng buộc phụ thuộc khởi động (Start Order & Health Dependency)
    # Đảm bảo NestJS chỉ khởi động khi Postgres & Redis đạt trạng thái "healthy"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

    networks:
      - backend-network

# ------------------------------------------------------------------------------
# 2. KHAI BÁO MẠNG NỘI BỘ (CUSTOM BRIDGE NETWORKS)
# ------------------------------------------------------------------------------
# [TODO 7]: Định nghĩa Custom Bridge Network mang tên "backend-network"
# Sử dụng driver: bridge
networks:
  backend-network:
    name: devops_backend_custom_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

# ------------------------------------------------------------------------------
# 3. KHAI BÁO CÁC NAMED VOLUMES (PERSISTENT DATA VOLUMES)
# ------------------------------------------------------------------------------
# [TODO 8]: Khai báo các Named Volumes cấp cao nhất
volumes:
  postgres_data:
    name: devops_postgres_data_vol
    driver: local
  redis_data:
    name: devops_redis_data_vol
    driver: local

# ==============================================================================
# HƯỚNG DẪN KIỂM TRA VÀ THỰC THI (VERIFICATION COMMANDS):
# ==============================================================================
# 1. Kiểm tra tính hợp lệ của cú pháp Compose:
#    docker compose -f "03. Docker Networking & Volumes.yml" config
#
# 2. Khởi chạy toàn bộ cụm dịch vụ ở chế độ chạy ngầm (Detached mode):
#    docker compose -f "03. Docker Networking & Volumes.yml" up -d --build
#
# 3. Kiểm tra trạng thái hoạt động và Healthcheck của từng container:
#    docker compose -f "03. Docker Networking & Volumes.yml" ps
#    (Các container phải hiển thị trạng thái "Up (healthy)")
#
# 4. Kiểm tra mạng nội bộ và DNS Discovery:
#    docker exec -it devops_nestjs_container ping -c 3 postgres-db
#    docker exec -it devops_nestjs_container ping -c 3 redis-cache
#
# 5. Kiểm tra tính bền vững của Dữ liệu (Volume Persistence Test):
#    - Bước 1: Tạo dữ liệu trong Postgres:
#      docker exec -it devops_postgres_container psql -U nest_user -d ecommerce_db -c "CREATE TABLE test (id serial PRIMARY KEY, name VARCHAR(50)); INSERT INTO test(name) VALUES ('Obsidian Vault Persistence');"
#    - Bước 2: Dừng và xóa toàn bộ container:
#      docker compose -f "03. Docker Networking & Volumes.yml" down
#    - Bước 3: Khởi động lại cụm:
#      docker compose -f "03. Docker Networking & Volumes.yml" up -d
#    - Bước 4: Truy vấn lại dữ liệu để chứng minh Volume không bị mất:
#      docker exec -it devops_postgres_container psql -U nest_user -d ecommerce_db -c "SELECT * FROM test;"
#
# 6. Dọn dẹp sạch sẽ (Bao gồm cả Volumes):
#    docker compose -f "03. Docker Networking & Volumes.yml" down -v
# ==============================================================================
