# ==============================================================================
# BÀI TẬP THỰC HÀNH: GITHUB ACTIONS CI/CD PIPELINE AUTOMATION
# ==============================================================================
# Tệp: 02. ci-cd.yml
# Vị trí chuẩn trong Repository: .github/workflows/ci-cd.yml
# Khóa học: DevOps & Architecture - CI/CD & Deployment
#
# MỤC TIÊU BÀI THỰC HÀNH:
# 1. Thiết lập Trigger kích hoạt tự động khi có Push / Pull Request vào nhánh main & develop.
# 2. Xây dựng Job Kiểm chuẩn (Linting & TypeScript Type Check) với Dependency Caching.
# 3. Xây dựng Job Kiểm thử tự động (Unit Test & E2E Test) tích hợp Database Service Containers.
# 4. Xây dựng Job Đóng gói Docker Image đa tầng (Multi-stage Build) với Docker Buildx.
# 5. Đăng nhập và Push Image lên Docker Hub / GitHub Container Registry (GHCR) an toàn bằng Secrets.
# 6. Triển khai tự động (Deployment Step) lên máy chủ Production với Zero-downtime.
#
# HƯỚNG DẪN:
# - Đọc kỹ các phần giải thích chi tiết và điền đầy đủ cấu hình tại các vị trí [TODO 1] đến [TODO 6].
# ==============================================================================

name: Production NestJS CI/CD Pipeline

# ------------------------------------------------------------------------------
# [TODO 1]: CẤU HÌNH EVENT TRIGGERS (SỰ KIỆN KÍCH HOẠT PIPELINE)
# ------------------------------------------------------------------------------
# Gợi ý:
# - Kích hoạt khi có `push` vào nhánh: `main` hoặc `develop`
# - Kích hoạt khi có `pull_request` mở vào nhánh: `main`
# - Hỗ trợ kích hoạt thủ công qua giao diện GitHub (`workflow_dispatch`)
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Khai báo quyền hạn bảo mật (GIST / Security Permissions)
permissions:
  contents: read
  packages: write
  security-events: write

# Khai báo các biến môi trường toàn cục cho Workflow
env:
  NODE_VERSION: '20.x'
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/nestjs-backend-api

jobs:
  # ============================================================================
  # JOB 1: KIỂM CHUẨN MÃ NGUỒN & TYPE CHECKING (LINT & STATIC ANALYSIS)
  # ============================================================================
  lint-and-typecheck:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Bước 1: Kéo mã nguồn từ GitHub Repository về Runner
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      # [TODO 2]: Cấu hình Node.js môi trường với cơ chế Caching npm dependencies
      # Gợi ý: Sử dụng action `actions/setup-node@v4` với thuộc tính `cache: 'npm'`
      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Bước 2: Cài đặt dependencies sạch (Deterministic install)
      - name: 📦 Install dependencies (npm ci)
        run: npm ci

      # Bước 3: Chạy ESLint kiểm tra quy tắc viết code
      - name: 🧹 Run ESLint
        run: npm run lint

      # Bước 4: Kiểm tra tính toàn vẹn kiểu dữ liệu TypeScript (Không xuất file build)
      - name: 📐 Run TypeScript Compiler Check
        run: npx tsc --noEmit

  # ============================================================================
  # JOB 2: TỰ ĐỘNG CHẠY KIỂM THỬ ĐƠN VỊ & TÍCH HỢP (AUTOMATED TESTING)
  # ============================================================================
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    # [TODO 3]: Thiết lập quan hệ phụ thuộc - Job này chỉ chạy khi Job lint-and-typecheck thành công
    needs: [lint-and-typecheck]
    timeout-minutes: 15

    # Cấu hình Service Containers chạy ngầm Postgres & Redis để phục vụ Integration Test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # Bước chạy Unit Tests
      - name: 🧪 Run Unit Tests with Coverage
        run: npm run test -- --coverage --coverageReporters=text-summary --coverageReporters=lcov
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Bước lưu trữ Báo cáo Coverage làm Artifact
      - name: 📊 Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  # ============================================================================
  # JOB 3: BUILD & PUSH DOCKER IMAGE (CONTAINER REGISTRY PUBLISHING)
  # ============================================================================
  build-and-push-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    # [TODO 4]: Thiết lập điều kiện thực thi - Chỉ build và push image khi PUSH vào nhánh MAIN
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Cài đặt QEMU để hỗ trợ Multi-platform build (ví dụ: linux/amd64, linux/arm64)
      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Cài đặt Docker Buildx (Bộ công cụ build container tiên tiến nhất của Docker)
      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # [TODO 5]: Đăng nhập vào Docker Hub sử dụng GitHub Repository Secrets
      # Gợi ý: Dùng action `docker/login-action@v3`
      # - username: ${{ secrets.DOCKERHUB_USERNAME }}
      # - password: ${{ secrets.DOCKERHUB_TOKEN }} (Personal Access Token)
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Trích xuất Metadata và sinh Image Tags thông minh (latest, git sha, semver)
      - name: 🏷️ Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=commit-,format=short
            type=semver,pattern={{version}}

      # [TODO 6]: Build và Push Docker Image kèm theo GitHub Actions Cache (Layer Caching)
      # Gợi ý: Dùng `cache-from: type=gha` và `cache-to: type=gha,mode=max` để tăng tốc độ build
      - name: 🔨 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 4: TRIỂN KHAI LÊN PRODUCTION SERVER (ZERO-DOWNTIME DEPLOYMENT)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [build-and-push-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.yourdomain.com

    steps:
      - name: 📡 Execute Remote Deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          script: |
            echo "🚀 [Deploy] Đang kéo image phiên bản mới nhất từ Registry..."
            docker pull ${{ env.IMAGE_NAME }}:latest
            
            echo "🔄 [Deploy] Tái khởi động cụm ứng dụng bằng Docker Compose..."
            cd /opt/my-backend-app
            docker compose up -d --no-deps --build nestjs-app
            
            echo "🧹 [Deploy] Dọn dẹp các dangling image cũ không còn sử dụng..."
            docker image prune -f
            
            echo "✅ [Deploy] Triển khai phiên bản mới thành công!"
