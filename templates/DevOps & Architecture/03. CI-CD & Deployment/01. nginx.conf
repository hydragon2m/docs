# ==============================================================================
# BÀI TẬP THỰC HÀNH: NGINX PRODUCTION REVERSE PROXY & LOAD BALANCER
# ==============================================================================
# Tệp: 01. nginx.conf
# Khóa học: DevOps & Architecture - CI/CD & Deployment
#
# MỤC TIÊU BÀI THỰC HÀNH:
# 1. Cấu hình Load Balancing phân phối tải qua 3 instance NestJS (Port 3000, 3001, 3002).
# 2. Thiết lập TLS/SSL Termination giải mã HTTPS tập trung & Tự động Redirect HTTP -> HTTPS.
# 3. Áp dụng Rate Limiting bảo vệ hệ thống chống DDoS / Brute Force (Bộ nhớ đệm Leaky Bucket).
# 4. Hỗ trợ kết nối thời gian thực WebSocket (Bắt tay nâng cấp giao thức Upgrade/Connection).
# 5. Thiết lập Security Headers và tối ưu hóa hiệu năng I/O tĩnh (Gzip, Static Caching).
#
# HƯỚNG DẪN:
# - Đọc kỹ các phần giải thích chi tiết và điền đầy đủ cấu hình tại các vị trí [TODO 1] đến [TODO 6].
# - Kiểm tra tính đúng đắn cấu hình bằng lệnh: `nginx -t -c /path/to/nginx.conf`
# ==============================================================================

# Khối cấu hình toàn cục (Global Context)
user nginx;
worker_processes auto;                    # Tự động điều chỉnh số lượng worker theo số nhân CPU
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;  # Mức độ log lỗi: debug, info, notice, warn, error, crit

# Cấu hình xử lý kết nối (Events Context)
events {
    worker_connections 2048;              # Số kết nối đồng thời tối đa trên mỗi worker
    multi_accept on;                      # Cho phép worker chấp nhận tất cả kết nối mới cùng lúc
    use epoll;                            # Cơ chế I/O multiplexing hiệu năng cao nhất trên Linux
}

# Khối cấu hình HTTP (HTTP Context)
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng Log chuẩn cho Production (Kèm theo thời gian phản hồi upstream_response_time)
    log_format production_json escape=json '{'
        '"time_local":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log production_json;

    # Tối ưu hóa truyền dữ liệu ở tầng Kernel (Zero-copy)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;                    # Ẩn phiên bản Nginx trong Header Response để bảo mật

    # --------------------------------------------------------------------------
    # [TODO 1]: CẤU HÌNH RATE LIMITING (CHỐNG SPAM VÀ DDOS)
    # --------------------------------------------------------------------------
    # Gợi ý:
    # - Sử dụng $binary_remote_addr để tiết kiệm bộ nhớ RAM (4 bytes cho IPv4 thay vì 15 bytes chuỗi).
    # - Tạo zone "api_limit_zone" dung lượng 10MB (chứa khoảng 160.000 IP).
    # - Giới hạn tốc độ: 20 requests / giây (20r/s).
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=20r/s;
    limit_req_status 429;                 # Trả về HTTP 429 Too Many Requests khi vượt ngưỡng

    # --------------------------------------------------------------------------
    # [TODO 2]: CẤU HÌNH CỤM CÂN BẰNG TẢI (UPSTREAM LOAD BALANCING)
    # --------------------------------------------------------------------------
    # Gợi ý:
    # - Đặt tên upstream là: "nestjs_backend_cluster"
    # - Thuật toán: least_conn (chuyển traffic vào server có ít kết nối nhất)
    # - 3 Node NestJS:
    #   + Node 1: 127.0.0.1:3000 (weight=3, max_fails=3, fail_timeout=10s)
    #   + Node 2: 127.0.0.1:3001 (weight=2, max_fails=3, fail_timeout=10s)
    #   + Node 3: 127.0.0.1:3002 (weight=1, max_fails=3, fail_timeout=10s)
    # - keepalive 32 để duy trì TCP connection pool giữa Nginx và NestJS
    upstream nestjs_backend_cluster {
        least_conn;                       # Thuật toán: Least Connections

        server 127.0.0.1:3000 weight=3 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 weight=2 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 weight=1 max_fails=3 fail_timeout=10s;

        keepalive 32;                     # Giữ 32 kết nối idle đến các upstream nodes
    }

    # Cấu hình nén GZIP giảm băng thông truyền tải
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --------------------------------------------------------------------------
    # SERVER BLOCK 1: CHUYỂN HƯỚNG TỰ ĐỘNG TỪ HTTP SANG HTTPS (PORT 80 -> 443)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.yourdomain.com;

        # Chuyển hướng vĩnh viễn (HTTP 301) toàn bộ truy vấn sang HTTPS
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # SERVER BLOCK 2: MÁY CHỦ CHÍNH HTTPS (TLS TERMINATION & PROXY)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.yourdomain.com;

        # ----------------------------------------------------------------------
        # [TODO 3]: CẤU HÌNH CHỨNG CHỈ VÀ BẢO MẬT TLS / SSL
        # ----------------------------------------------------------------------
        # Gợi ý:
        # - ssl_certificate: /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        # - ssl_certificate_key: /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
        # - Giao thức an toàn: TLSv1.2 TLSv1.3 (Loại bỏ SSLv3, TLSv1.0, TLSv1.1)
        # - Session cache: shared:SSL:10m (10MB lưu khoảng 40.000 sessions)
        ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # SECURITY HEADERS
        # ----------------------------------------------------------------------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ----------------------------------------------------------------------
        # [TODO 4]: PROXY TOÀN BỘ API REQUESTS VÀO CỤM NESTJS
        # ----------------------------------------------------------------------
        location / {
            # Kích hoạt Rate Limiting: cho phép burst=10 request vượt đỉnh, không trễ (nodelay)
            limit_req zone=api_limit_zone burst=10 nodelay;

            # Định tuyến tới Upstream Cluster
            proxy_pass http://nestjs_backend_cluster;

            # Sử dụng HTTP/1.1 để hỗ trợ Keep-Alive và WebSocket
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward đầy đủ Header gốc của Client để NestJS nhận diện đúng IP và Protocol
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Thiết lập Timeout kết nối an toàn
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Cấu hình Buffer
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ----------------------------------------------------------------------
        # [TODO 5]: CẤU HÌNH CHO WEBSOCKET (SOCKET.IO / REALTIME GATEWAY)
        # ----------------------------------------------------------------------
        # Gợi ý: WebSocket cần bắt tay nâng cấp giao thức (Protocol Upgrade Handshake)
        # - Upgrade header: $http_upgrade
        # - Connection header: "upgrade"
        # - Tăng read_timeout lên thời gian dài (ví dụ: 86400s = 24h) để tránh ngắt socket nhàn rỗi.
        location /socket.io/ {
            proxy_pass http://nestjs_backend_cluster;
            proxy_http_version 1.1;

            # Bắt buộc cho WebSocket Handshake:
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Giữ kết nối mở lâu dài cho WebSocket
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # [TODO 6]: PHỤC VỤ VÀ BỘ ĐỆM TỆP TĨNH (STATIC ASSETS CACHING)
        # ----------------------------------------------------------------------
        location /static/ {
            alias /var/www/nestjs-app/public/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;               # Tắt ghi log để tiết kiệm I/O đĩa
            try_files $uri $uri/ =404;
        }

        # Endpoint kiểm tra sức khỏe của riêng Nginx
        location /healthz {
            access_log off;
            return 200 '{"status":"UP","gateway":"Nginx"}';
            add_header Content-Type application/json;
        }
    }
}

# ==============================================================================
# HƯỚNG DẪN KIỂM TRA VÀ VẬN HÀNH (OPERATIONAL RUNBOOK):
# ==============================================================================
# 1. Kiểm tra cú pháp tệp cấu hình trước khi reload:
#    sudo nginx -t
#
# 2. Reload Nginx mà không làm gián đoạn kết nối đang hoạt động (Zero Downtime):
#    sudo nginx -s reload
#
# 3. Kiểm tra chuyển hướng HTTP -> HTTPS:
#    curl -I http://api.yourdomain.com
#    (Kỳ vọng: HTTP/1.1 301 Moved Permanently -> Location: https://api.yourdomain.com/)
#
# 4. Kiểm tra Rate Limiting:
#    for i in {1..30}; do curl -s -o /dev/null -w "%{http_code}\n" https://api.yourdomain.com/healthz; done
#    (Kỳ vọng: Các request ban đầu trả về 200, các request vượt ngưỡng trả về 429)
#
# 5. Theo dõi Access Log thời gian thực dạng JSON:
#    tail -f /var/log/nginx/access.log | jq .
# ==============================================================================
